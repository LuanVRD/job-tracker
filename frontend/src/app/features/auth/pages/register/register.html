<app-auth-layout title="Faça seu cadastro" footerText="Já possui uma conta? Entre agora!" footerLink="/login">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-1">
        <app-error-box [errorMessage]="errorMessage()"></app-error-box>
        <mat-form-field>
            <mat-label>Nome</mat-label>
            <input matInput formControlName="name" required>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Email</mat-label>
            <input matInput placeholder="email@email.com" formControlName="email" required>
        </mat-form-field>
        <app-password-input formControlName="password" label="Senha"></app-password-input>
        <app-password-input formControlName="passwordConfirm" label="Confirmar senha"></app-password-input>
        <div class="d-flex justify-center">
            <app-loading-button [loading]="loading()"
                [disabled]="registerForm.invalid || loading()">Cadastrar</app-loading-button>
        </div>
    </form>
</app-auth-layout>
