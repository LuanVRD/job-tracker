<mat-form-field>
    <mat-label>{{label()}}</mat-label>
    <input matInput [type]="viewPassword ? 'text' : 'password'" [value]="innerValue" (input)="onUserType($event)"
        (blur)="onUserLeft()" required>
    <button matIconButton matSuffix type="button" aria-label="View password" (click)="viewPassword = !viewPassword">
        <mat-icon>{{viewPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
</mat-form-field>
